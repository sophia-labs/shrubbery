<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Margin Keeper — synthetic footer layout</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { color: #374151; background: #f7f5ef; font: 14px system-ui, sans-serif; }
      .app-container { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      header { padding: 10px 14px; border-bottom: 1px solid #d8d5cb; font-size: 12px; }
      .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr) minmax(0, 420px); overflow: hidden; }
      .main > div { padding: 14px; overflow: hidden; border-right: 1px solid #d8d5cb; }
      .main > div:nth-child(2) { text-align: center; }
      footer { flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header>Margin Keeper · synthetic labels, real footer component · no graph or backend</header>
      <div class="main"><div>Sidebar · 280px</div><div>Document area</div><div>Right panel · 420px</div></div>
      <footer role="contentinfo"><mn-bottom-bar></mn-bottom-bar></footer>
    </div>
    <script type="module" src="/src/harness/footer-layout-harness-main.ts"></script>
  </body>
</html>

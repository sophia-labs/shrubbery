<!doctype html>
<html lang="en" data-skin="garden" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEELe Workbench</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #eeece6; }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        color: #27332c;
        font-family: system-ui, sans-serif;
      }
      #workbench-chrome {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 10px;
        padding: 8px 12px;
        border-bottom: 1px solid #cbc6bb;
        background: #f6f3ec;
        font-size: 12px;
      }
      #workbench-chrome .title {
        font-weight: 600;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.06em;
      }
      #workbench-chrome .identity {
        color: #6c6a63;
        font-family: ui-monospace, monospace;
      }
      #workbench-stage {
        position: relative;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
      }
      #seele-workbench-root { position: relative; }

      /*
       * THE RESERVED CHAT DOCK (ratification delta 1, D15/D8).
       *
       * Vera: "build NOTHING for this revision except a clear, visible place
       * where it will eventually go — a labelled affordance, zero machinery."
       * So this is exactly that: a labelled, empty, COLLAPSED region in the
       * vessel's chrome. It has no click handler, no session wiring, no
       * `/api/sessions` call, no expanded state to toggle into, and no
       * placeholder message list pretending to be a transcript. It is inert on
       * purpose, and `aria-disabled` says so to a screen reader rather than
       * only to a sighted user.
       */
      #chat-dock {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 12px;
        border-top: 1px solid #cbc6bb;
        background: #f1eee6;
        color: #8a8880;
        font-size: 11px;
        font-variant-caps: all-small-caps;
        letter-spacing: 0.06em;
        user-select: none;
      }
      #chat-dock .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #cbc6bb;
      }
      #chat-dock .reserved {
        margin-left: auto;
        font-variant-caps: normal;
        letter-spacing: normal;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <header id="workbench-chrome">
      <span class="title">SEELe Workbench</span>
      <span class="identity" id="workbench-identity"></span>
    </header>
    <main id="workbench-stage">
      <div id="seele-workbench-root"></div>
    </main>
    <footer
      id="chat-dock"
      data-chat-dock="reserved"
      data-chat-dock-state="collapsed"
      aria-label="Chat dock (reserved)"
      aria-disabled="true"
    >
      <span class="dot" aria-hidden="true"></span>
      <span>Chat</span>
      <span class="reserved">reserved — not in this revision</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

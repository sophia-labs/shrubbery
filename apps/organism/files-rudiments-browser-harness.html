      #files-harness-root .split-pane { position: relative; display: flex; min-width: 0; min-height: 0; overflow: hidden; border-right: 1px solid var(--mn-color-border-subtle, #d8e2dc); }
      #files-harness-root .split-pane > * { flex: 1 1 auto; min-width: 0; min-height: 0; }
      #files-harness-root .panel-edge-btns { z-index: 4; }

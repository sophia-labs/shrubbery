<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shrubbery Settings browser harness</title>
    <style>
      html, body, #settings-harness-root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; }
      #settings-harness-root > .organism-route-frame {
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
        flex-direction: column;
      }
      #settings-harness-root .route-main {
        display: flex;
        width: 100%;
        min-height: 0;
        flex: 1 1 auto;
      }
      #settings-harness-failure { position: fixed; inset: 12px; z-index: 9999; color: #b91c1c; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="settings-harness-root"></div>
    <pre id="settings-harness-failure" hidden></pre>
    <script type="module" src="/src/harness/settings-main.ts"></script>
  </body>
</html>

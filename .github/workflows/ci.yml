name: Shrubbery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shrubbery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The organism build needs more than node's default heap with every app in the
# tree; the SPA ship lane runs with the same limit.
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # The gate. Everything here must be green to merge, and a merge to main ships the hosted app (the SPA ship
  # lane builds from this repository): frozen install, lint, typecheck of the whole workspace, the no-mocks
  # ratchet, the source-owned tests, the production builds, and the self-host build that gardend's release
  # archives carry as ui/.
  gate:
    name: Lint, typecheck, no-mocks, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck the whole workspace
        run: pnpm -r --no-bail run typecheck

      - name: Guard the no-mocks principle
        run: node scripts/validate-no-mocks.mjs

      - name: Run source-owned tests
        run: pnpm test:source

      - name: Build the whole workspace
        run: pnpm -r --no-bail run build

      - name: Build the self-host UI (gardend's ui/)
        run: |
          pnpm build:selfhost
          test -f apps/organism/dist-selfhost/index.html

  # Real gardend, real browsers, one command: the same `pnpm test:real` a contributor runs locally. It downloads the
  # prebuilt gardend (built by sophia-labs/gardend for every commit on its main), so no Rust toolchain is involved,
  # and runs the suites in Chromium and WebKit. Gating: a browser regression is a regression.
  browser:
    name: Real gardend, Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the real-gardend suites
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI: "true"
        run: pnpm test:real

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shrubbery-browser-evidence
          path: |
            ${{ runner.temp }}/shrubbery-browser-artifacts
          if-no-files-found: ignore
          retention-days: 14

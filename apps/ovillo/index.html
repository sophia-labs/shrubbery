<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Ovillo: pieces played by Ariadne Worlds, physical models of instruments and rooms, with each World's energy ledger." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Ovillo</title>
    <!-- No inline script: the page runs under a CSP of own-origin scripts only.
         Structural styles only; colour and type resolve from @shrubbery/tokens,
         which main.ts imports. Before the tokens load, the system's scheme
         paints the page so a dark-mode visitor is not flashed white. -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--mn-color-surface-canvas, #f7f6f2);
        color: var(--mn-color-text-primary, #1f2a24);
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) body { background: var(--mn-color-surface-canvas, #141713); color: var(--mn-color-text-primary, #e6e8e3); }
      }
      ovillo-app { display: block; min-height: 100dvh; }
      #ovillo-audio { display: none; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <ovillo-app></ovillo-app>
    <noscript>Ovillo needs JavaScript to read its graph and play. The pieces' files are under /media/.</noscript>
  </body>
</html>

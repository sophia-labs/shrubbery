<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planter — the generic curl-able host</title>
    <style>
      /* Structural only — colors/fonts/radii all resolve from @shrubbery/tokens'
         --mn-* role tokens (imported in main.ts), so the shell repaints with
         whichever skin/theme the host stamps on <html>. */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: var(--mn-font-chrome, system-ui, sans-serif);
        color: var(--mn-color-text-primary, #111);
        background: var(--mn-color-surface-base, #fff);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      #app {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .planter-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      /* @shrubbery/runtime's renderWorkspace structural frame — no theming
         here (that's the runtime package's own CSS import), just enough
         height/display so the chrome + 3-pane spine actually occupies the
         viewport instead of collapsing to zero height. */
      .planter-body .app-container {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .planter-body .main {
        flex: 1;
        min-height: 0;
      }
      .planter-status-strip {
        flex-shrink: 0;
        padding: 6px 16px;
        font-size: 11px;
        font-family: ui-monospace, monospace;
        border-bottom: 1px solid var(--mn-color-border-subtle, #eee);
        background: var(--mn-color-surface-raised, #fafafa);
      }
      .planter-bundle-notice {
        flex-shrink: 0;
        padding: 8px 16px;
        border-bottom: 1px solid var(--mn-color-border-subtle, #eee);
        background: var(--mn-color-surface-accent, #edf6ef);
        color: var(--mn-color-text-secondary, #374151);
        font-size: 12px;
      }
      .planter-bundle-notice[hidden] { display: none; }
      .planter-panel {
        padding: 2rem;
        max-width: 60rem;
      }
      .planter-panel pre {
        white-space: pre-wrap;
        background: var(--mn-color-surface-sunken, #f5f5f5);
        padding: 0.75rem 1rem;
        border-radius: 4px;
        overflow-x: auto;
      }
      .planter-panel-error h2 { color: var(--mn-color-danger, #b91c1c); }
      .planter-retry {
        font: inherit;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

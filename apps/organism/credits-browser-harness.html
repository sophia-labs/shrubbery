<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Credits browser harness</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { background: var(--mn-color-surface-base, #f7f8f5); font-family: var(--mn-font-chrome, system-ui, sans-serif); color: var(--mn-color-text-primary, #20252b); }
      /* The workspace as far as the chat is concerned: a column on the right of a desktop, the whole screen on a phone. */
      #surface { height: 100dvh; }
      #frame { height: 100dvh; display: flex; justify-content: flex-end; }
      #rail { width: min(420px, 100%); height: 100%; border-left: 1px solid var(--mn-color-border-subtle, #d8ded9); position: relative; background: var(--mn-color-surface-panel, #fff); }
      #note { position: fixed; left: 24px; top: 20px; max-width: 34ch; color: var(--mn-color-text-secondary, #66736a); font-size: 13px; line-height: 1.5; }
      @media (max-width: 800px) { #note { display: none; } }
      /* The Settings route as the app frames it. */
      #settings-root, #settings-root > .organism-route-frame { width: 100%; height: 100%; }
      #settings-root > .organism-route-frame { display: flex; min-height: 0; flex-direction: column; }
      #settings-root .route-main { display: flex; width: 100%; min-height: 0; flex: 1 1 auto; }
      #settings-failure { position: fixed; inset: 12px; z-index: 9999; color: #b91c1c; white-space: pre-wrap; }
      /* The calm opaque layer the shell puts Settings in when it opens over a live workspace (index.html). */
      .organism-settings-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; background: var(--mn-color-surface-canvas, #f5f3ed); }
      .organism-settings-overlay > .organism-route-frame { flex: 1; min-width: 0; min-height: 0; }
      .organism-settings-overlay .app-container { display: flex; flex-direction: column; height: 100%; min-height: 0; }
      .organism-settings-overlay .main { position: relative; flex: 1; display: flex; min-height: 0; overflow: hidden; }
      .organism-settings-overlay .route-main { width: 100%; height: 100%; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="surface">
      <p id="note">Harness page: the real chat host in a rail-sized frame, with the shell's own wiring for credits (the balance line, Add credits, the notice), against a scripted gateway. The workspace around it is not part of it.</p>
      <div id="frame"><div id="rail"></div></div>
    </div>
    <div id="settings-root" hidden></div>
    <pre id="settings-failure" hidden></pre>
    <script type="module" src="/scripts/credits-browser-page.ts"></script>
  </body>
</html>

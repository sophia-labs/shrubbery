<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="hoja — a quiet notes app. Each note is a seed." />
    <link rel="icon" type="image/svg+xml" href="/hoja-mark.svg" />
    <title>hoja</title>
    <!-- Garden identity is the token :root default, so no data-skin here:
         stamping data-skin="garden" re-applied the LIGHT fern top bar and
         accents over the dark theme (QA P1-5). First paint honours the
         reader's stored choice; hoja-app owns the theme after that. -->
    <script>
      ;(() => {
        let choice = 'system'
        try { choice = localStorage.getItem('shrubbery.hoja.theme') || 'system' } catch {}
        const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #faf9f6;
        color: #1f1e1b;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      [data-theme='dark'] body {
        background: #16150f;
        color: #e8e5da;
      }

      button,
      input {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
